<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>what.weather</title>
<meta name="description" content="Compare today's temperature with the same day in another year.">
<meta property="og:title" content="what.weather">
<meta property="og:description" content="Today's temperature vs. the same day in another year.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://whatweather.xyz">
<meta property="og:image" content="https://whatweather.xyz/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="what.weather">
<meta name="twitter:description" content="Today's temperature vs. the same day in another year.">
<meta name="twitter:image" content="https://whatweather.xyz/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;600;700&family=Google+Sans+Code:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="app">

  <section class="half half--top" id="halfToday">
    <div class="half__inner">
      <header class="half__header">
        <h1 class="half__label">Today</h1>
        <div class="half__place" id="placeName">—</div>
      </header>

      <div class="half__body">
        <div class="temp" id="todayTemp">
          <span class="temp__value" id="todayMax">...</span><span class="temp__deg">°</span>
        </div>
        <div class="temp__min" id="todayMin">&nbsp;</div>
      </div>

      <div class="half__notice" id="todayNotice" hidden></div>
    </div>
  </section>

  <div class="badge" id="diffBadge" hidden>
    <span id="diffValue">+0°</span>
  </div>

  <section class="half half--bottom" id="halfHistory">
    <div class="half__inner">
      <header class="half__header">
        <h1 class="half__label">Same day</h1>
        <div class="year-control">
          <button class="year-arrow" id="yearPrev" aria-label="Previous year">&lsaquo;</button>
          <span class="year-current-wrap">
            <button class="year-current" id="yearButton" aria-haspopup="listbox" aria-expanded="false">
              <span id="yearValue">—</span>
            </button>
            <select class="year-select" id="yearSelect" aria-label="Choose year"></select>
          </span>
          <button class="year-arrow" id="yearNext" aria-label="Next year">&rsaquo;</button>
        </div>
      </header>

      <div class="half__body">
        <div class="temp" id="historyTemp">
          <span class="temp__value" id="historyMax">...</span><span class="temp__deg">°</span>
        </div>
        <div class="temp__min" id="historyMin">&nbsp;</div>
      </div>

      <div class="half__notice" id="historyNotice" hidden></div>

      <div class="footer-actions">
        <button class="text-link" id="randomYear">&#8635; random year</button>
        <span class="footer-sep" aria-hidden="true">&middot;</span>
        <button class="text-link" id="shareBtn">&#8599; share</button>
        <span class="footer-sep" aria-hidden="true">&middot;</span>
        <button class="text-link" id="shareStoryBtn">story</button>
      </div>
      <div class="half__notice" id="shareNotice" hidden></div>
    </div>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
