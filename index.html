<title>what weather: Compare Today's Temperature to Any Past Year</title>
<meta name="description" content="Compare today's temperature with the same calendar day in a past year, anywhere in the world. Free, no sign-up.">
<link rel="canonical" href="https://whatweather.xyz/">
<meta property="og:title" content="what weather">
<meta property="og:description" content="Today's temperature vs. the same day in another year, anywhere in the world.">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "what weather",
  "url": "https://whatweather.xyz",
  "applicationCategory": "UtilityApplication",
  "operatingSystem": "Any (web)",
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
  "description": "Compare today's temperature with the same calendar day in a past year, anywhere in the world.",
  "author": { "@type": "Person", "name": "Rui Barroca", "url": "https://www.ruibarroca.com" }
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<h1 class="visually-hidden">what weather: compare today's temperature with any past year</h1>
<noscript>
  <p class="noscript-notice">what weather compares today's temperature with the same day in a past year. Enable JavaScript to use the app, or <a href="/about">read more on the about page</a>.</p>
</noscript>
<main class="app">

  <section class="half half--top" id="halfToday">
    <div class="half__inner">
      <header class="half__header">
        <h2 class="half__label">Today</h2>
        <div class="place-control" id="placeControl">
          <button class="place-name" id="placeButton" aria-haspopup="listbox" aria-expanded="false" aria-label="Change location">
            <span id="placeName">—</span>
          </button>
          <div class="place-panel" id="placePanel" hidden>
            <input type="text" class="place-input" id="placeInput" placeholder="Search city…" aria-label="Search city" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="placeResults">
            <ul class="place-results" id="placeResults" role="listbox" aria-label="City results"></ul>
            <div class="place-panel__footer">
              <span class="place-status" id="placeStatus" aria-live="polite"></span>
              <button class="text-link" id="useLocationBtn" type="button">use my location</button>
            </div>
          </div>
        </div>
      </header>

      <div class="half__body">
        <div class="temp" id="todayTemp">
          <span class="temp__value" id="todayMax">...</span><span class="temp__deg">°</span>
        </div>
        <div class="temp__min" id="todayMin">&nbsp;</div>
      </div>

      <div class="half__notice" id="todayNotice" hidden></div>
    </div>
  </section>

  <div class="badge" id="diffBadge" hidden>
    <span id="diffValue">+0°</span>
  </div>

  <section class="half half--bottom" id="halfHistory">
    <div class="half__inner">
      <header class="half__header">
        <h2 class="half__label">Same day</h2>
        <div class="year-control">
          <button class="year-arrow" id="yearPrev" aria-label="Previous year">&lsaquo;</button>
          <span class="year-current-wrap">
            <button class="year-current" id="yearButton" aria-haspopup="listbox" aria-expanded="false">
              <span id="yearValue">—</span>
            </button>
            <select class="year-select" id="yearSelect" aria-label="Choose year"></select>
          </span>
          <button class="year-arrow" id="yearNext" aria-label="Next year">&rsaquo;</button>
        </div>
      </header>

      <div class="half__body">
        <div class="temp" id="historyTemp">
          <span class="temp__value" id="historyMax">...</span><span class="temp__deg">°</span>
        </div>
        <div class="temp__min" id="historyMin">&nbsp;</div>
      </div>

      <div class="half__notice" id="historyNotice" hidden></div>

      <div class="footer-actions">
        <div class="footer-group">
          <a class="text-link" href="/about">about</a>
          <span class="footer-sep" aria-hidden="true">&middot;</span>
          <div class="share-control" id="shareControl">
            <button class="text-link" id="shareBtn" aria-haspopup="true" aria-expanded="false">share</button>
            <div class="share-backdrop" id="shareBackdrop" hidden></div>
            <div class="share-menu" id="sharePanel" role="menu" aria-label="Share" hidden>
              <div class="share-menu__row" id="shareFormats" role="none">
                <button class="share-menu__item" id="shareFormatPost" type="button" role="menuitem">post</button>
                <button class="share-menu__item" id="shareFormatStory" type="button" role="menuitem">story</button>
              </div>
              <div class="share-menu__row" id="shareActions" role="none" hidden>
                <button class="share-menu__item" id="saveImageBtn" type="button" role="menuitem">save image</button>
                <button class="share-menu__item" id="copyLinkBtn" type="button" role="menuitem">copy link</button>
              </div>
              <div class="share-menu__status" id="sharePanelStatus" aria-live="polite"></div>
            </div>
          </div>
        </div>
        <div class="footer-group">
          <button class="text-link" id="randomYear">&#8635; random year</button>
        </div>
      </div>
      <div class="half__notice" id="shareNotice" hidden></div>
    </div>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
