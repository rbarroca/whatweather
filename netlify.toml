[build]
  publish = "."
  command = ""

[[redirects]]
  from = "https://appwhatweather.netlify.app/*"
  to = "https://whatweather.xyz/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/about"
  to = "/about/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-q/8OVBH4I7ISqTLhTcIijBiIFIGK2DHfwjDg/6mQJUg=' https://www.googletagmanager.com; connect-src 'self' https://api.open-meteo.com https://archive-api.open-meteo.com https://geocoding-api.open-meteo.com https://nominatim.openstreetmap.org https://ipwho.is https://ipapi.co https://www.google-analytics.com https://region1.google-analytics.com https://www.googletagmanager.com; img-src 'self' data: https://www.google-analytics.com https://www.googletagmanager.com; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'"
